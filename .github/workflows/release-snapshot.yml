name: publish-snapshot

on:
  schedule:
    # Nightly snapshot; 18:00 UTC every day.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  should-build:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Skip the nightly build+release when there is nothing new since the last
      # snapshot, so an unchanged day doesn't burn another letter. Manual
      # dispatch always builds (it's an explicit request).
      - name: Decide whether to build
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SNAP_RE='^[0-9]{2}w[0-9]{2}[a-z]$'
          LAST=$(git tag -l | grep -E "$SNAP_RE" | sort | tail -1)
          if [ -z "$LAST" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git rev-list --count "$LAST..HEAD" 2>/dev/null || echo 1)
          if [ "$COUNT" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }} DMG
    runs-on: macos-latest
    needs: should-build
    # Build each arch on its own runner: MakerDMG uses a fixed intermediate
    # name (Pine.dmg), so arm64 and x64 would collide if built in one run.
    if: needs.should-build.outputs.changed == 'true'
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Bump snapshot version
        run: bun run apps/desktop/scripts/bump-snapshot.mjs

      # MakerDMG -> electron-installer-dmg -> appdmg -> macos-alias, fs-xattr
      # pulls in host-side native addons (volume.node, xattr.node) that only run
      # on the build machine during `make`. bun install never compiles gyp
      # modules that lack an install/prebuild script, and electron-forge's
      # rebuild pass only covers the packaged app's runtime native deps — so we
      # build every appdmg-chain addon explicitly here, pinned to a modern
      # Python. Compiling every run keeps the build independent of whether the
      # runner happens to have stale compiled artifacts cached.
      - name: Build native DMG-maker addons
        run: |
          for pkg in macos-alias fs-xattr; do
            pushd "node_modules/$pkg"
            bunx node-gyp rebuild --python="$(command -v python3)"
            popd
          done

      - name: Build ${{ matrix.arch }} DMG
        working-directory: apps/desktop
        run: >-
          bunx electron-forge make --platform=darwin --arch=${{ matrix.arch }}
          --targets @electron-forge/maker-dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: apps/desktop/out/make/*.dmg
          if-no-files-found: error

  release:
    name: Publish snapshot
    runs-on: ubuntu-latest
    needs: [should-build, build]
    if: needs.should-build.outputs.changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bump snapshot version
        run: bun run apps/desktop/scripts/bump-snapshot.mjs

      - name: Resolve snapshot version
        id: version
        working-directory: apps/desktop
        run: |
          SNAPSHOT=$(bun -p "require('./package.json').version")
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dmgs
          merge-multiple: true

      - name: Publish snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.snapshot }}
          name: Pine snapshot ${{ steps.version.outputs.snapshot }}
          body: |
            Snapshot alpha build of Pine for macOS (Apple Silicon + Intel).

            Version: `${{ steps.version.outputs.snapshot }}`

            Source commit: `${{ github.sha }}`
          prerelease: true
          generate_release_notes: true
          files: dmgs/*.dmg
