name: publish-snapshot

on:
  schedule:
    # Nightly snapshot; 18:00 UTC every day.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }} DMG
    runs-on: macos-latest
    strategy:
      # Build each arch on its own runner: MakerDMG uses a fixed intermediate
      # name (Pine.dmg), so arm64 and x64 would collide if built in one run.
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Bump snapshot version
        run: bun run apps/desktop/scripts/bump-snapshot.mjs

      - name: Build ${{ matrix.arch }} DMG
        working-directory: apps/desktop
        run: >-
          bunx electron-forge make --platform=darwin --arch=${{ matrix.arch }}
          --targets @electron-forge/maker-dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: apps/desktop/out/make/*.dmg
          if-no-files-found: error

  release:
    name: Publish snapshot
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bump snapshot version
        run: bun run apps/desktop/scripts/bump-snapshot.mjs

      - name: Resolve snapshot version
        id: version
        working-directory: apps/desktop
        run: |
          SNAPSHOT=$(bun -p "require('./package.json').version")
          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Download DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dmgs
          merge-multiple: true

      - name: Publish snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.snapshot }}
          name: Pine snapshot ${{ steps.version.outputs.snapshot }}
          body: |
            Snapshot alpha build of Pine for macOS (Apple Silicon + Intel).

            Version: `${{ steps.version.outputs.snapshot }}`

            Source commit: `${{ github.sha }}`
          prerelease: true
          generate_release_notes: true
          files: dmgs/*.dmg
